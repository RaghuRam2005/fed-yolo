# Example config for `uv run python -m obj_yolo.train --config configs/train.yaml`.
#
# Precedence: code defaults (obj_yolo/config.py::TRAIN_DEFAULTS) < this file
# < explicit CLI flags. Any key you omit here falls back to the code
# default; any flag you pass on the command line overrides this file.
# `--data` still has to be passed on the CLI (or add a `data:` key here --
# either works).

# --- data / model ---
# data: dataset/client_0/data.yaml
scale: n              # n | s | m | l | x
imgsz: 640

# --- optimizer / schedule ---
epochs: 100
batch: 16
workers: 4
optimizer: sgd         # sgd | adamw
lr0: 0.01
lrf: 0.01               # final LR as a fraction of lr0 (cosine schedule)
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
amp: true
ema_decay: 0.9999

# --- loss gains (DetectionLoss: box CIoU / cls BCE / DFL) ---
box_gain: 7.5
cls_gain: 0.5
dfl_gain: 1.5

# --- Task-Aligned Assigner ---
tal_topk: 10
tal_alpha: 0.5
tal_beta: 6.0

# --- validation-time NMS thresholds (loose, for a full PR curve) ---
eval_conf_thres: 0.001
eval_iou_thres: 0.6

# --- augmentation (obj_yolo/data/augment.py::DEFAULT_HYP) ---
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
aug_scale: 0.5           # renamed from augment.py's "scale" to avoid colliding with model `scale` above
shear: 0.0
fliplr: 0.5
mosaic: 1.0

# --- logging / run tracking ---
project: runs/train
run_name: null            # null = auto timestamp
tensorboard: true
log_histograms: true        # weight/gradient histograms every epoch (heavier, see README)
seed: 42
