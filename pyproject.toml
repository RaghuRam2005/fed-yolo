[build-system]
requires = ["setuptools>=65", "wheel", "hatchling"]
build-backend = "setuptools.build_meta"

[project]
name = "fed-yolo"
version = "2.0.0"
description = "YOLOv8 object detection implemented from scratch in PyTorch (federated learning integration: future work)"
readme = "README.md"
requires-python = ">=3.12"

authors = [
    {name = "RaghuRam2005", email="atommail20@gmail.com"}
]

dependencies = [
    "pyyaml>=6.0.3",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "torchmetrics[detection]>=1.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.setuptools]
packages = ["obj_yolo"]
